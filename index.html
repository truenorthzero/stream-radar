<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>northcorr — Stream Radar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    background:
      radial-gradient(ellipse at 30% 15%, rgba(60,255,140,0.06), transparent 55%),
      linear-gradient(160deg, #0c110d 0%, #070a07 55%, #050605 100%);
    font-family: Arial, Helvetica, sans-serif;
    color:#f5f7f4;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card {
    width: min(92vw, 480px);
    border: 1px solid rgba(60,255,107,0.25);
    border-radius: 14px;
    padding: 40px 32px;
    text-align:center;
    position:relative;
    background: rgba(10,14,10,0.5);
    box-shadow: 0 0 60px rgba(60,255,107,0.06);
  }
  .kicker {
    color:#3cff6b;
    font-size:13px;
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:18px;
    opacity:0.85;
  }
  .status-icon {
    font-size: 64px;
    margin-bottom: 14px;
    filter: drop-shadow(0 0 18px rgba(60,255,107,0.35));
  }
  .status-title {
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .status-sub {
    font-size: 15px;
    color: #b8c4b8;
    line-height:1.5;
    margin-bottom: 22px;
  }
  .rule {
    width: 46px;
    height: 3px;
    background: #3cff6b;
    margin: 0 auto 22px auto;
  }
  .meta {
    font-size: 12px;
    color: #6b7a6b;
    letter-spacing: 1px;
  }
  .loading { opacity:0.5; }
  a.follow {
    display:inline-block;
    margin-top:24px;
    color:#3cff6b;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    border:1px solid rgba(60,255,107,0.4);
    padding:10px 20px;
    border-radius:6px;
    transition: background 0.2s;
  }
  a.follow:hover { background: rgba(60,255,107,0.1); }
</style>
</head>
<body>

<div class="card">
  <div class="kicker">Northcorr // Stream Radar</div>
  <div id="icon" class="status-icon loading">⏳</div>
  <div id="title" class="status-title loading">Checking skies…</div>
  <div class="rule"></div>
  <div id="sub" class="status-sub">Give it a second — we're reading the clouds.</div>
  <div id="meta" class="meta"></div>
  <a class="follow" href="https://www.twitch.tv/northcorr" target="_blank" rel="noopener">Go to Channel</a>
</div>

<script>
async function loadStatus() {
  try {
    const res = await fetch('./status.json?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();

    const iconEl = document.getElementById('icon');
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('sub');
    const metaEl = document.getElementById('meta');

    iconEl.classList.remove('loading');
    titleEl.classList.remove('loading');

    if (data.raining) {
      iconEl.textContent = '🌧️';
      titleEl.textContent = "It's raining — stream time";
      subEl.textContent = 'Rain means indoor time, which means DayZ time. Pull up.';
    } else {
      iconEl.textContent = '☀️';
      titleEl.textContent = 'Clear skies — no stream (yet)';
      subEl.textContent = "Sun's out. Check back later, the second it rains this flips.";
    }

    if (data.last_checked) {
      const d = new Date(data.last_checked);
      metaEl.textContent = 'Last checked ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · auto-updates every 30 min';
    }
  } catch (e) {
    document.getElementById('title').textContent = 'Status unavailable';
    document.getElementById('sub').textContent = 'Could not load the latest reading — try refreshing.';
  }
}
loadStatus();
</script>
 
 

</body>
</html>
