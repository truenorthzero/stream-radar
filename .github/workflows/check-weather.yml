name: Check Weather

on:
  schedule:
    # Runs at :07 and :37 past every hour (UTC). Offset from the hour/half-hour
    # on purpose to avoid piling up with everyone else's cron jobs.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}   # lets you trigger a manual check from the Actions tab

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch weather and build status.json
        env:
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
        run: |
          set -euo pipefail

          if [ -z "${WEATHER_LAT:-}" ] || [ -z "${WEATHER_LON:-}" ]; then
            echo "WEATHER_LAT / WEATHER_LON secrets are not set. Add them in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Each secret must hold exactly one number. If either contains a
          # comma it's almost certainly both coordinates pasted into one
          # field, which makes Open-Meteo treat it as a multi-location
          # request and return a differently-shaped response.
          if [[ "$WEATHER_LAT" == *","* ]] || [[ "$WEATHER_LON" == *","* ]]; then
            echo "WEATHER_LAT / WEATHER_LON contain a comma. Each secret must hold ONE number only — e.g. WEATHER_LAT = 43.6532 and WEATHER_LON = -79.3832 as two separate secrets, not combined into one."
            exit 1
          fi

          # Open-Meteo is free and needs no API key. We never log or commit
          # the lat/lon themselves — only the derived raining/condition result.
          # timezone=auto lets Open-Meteo infer the local timezone from the
          # coordinates server-side (for correct day boundaries in the
          # forecast) without us ever storing or exposing it ourselves.
          RESPONSE=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=precipitation,weather_code&daily=weather_code,precipitation_probability_max&forecast_days=4&timezone=auto")

          WEATHER_CODE=$(echo "$RESPONSE" | jq -r '.current.weather_code // -1')
          PRECIP=$(echo "$RESPONSE" | jq -r '.current.precipitation // 0')

          # WMO weather codes: 51-67 = drizzle/rain/freezing rain,
          # 80-82 = rain showers, 95-99 = thunderstorm.
          RAINING="false"
          case "$WEATHER_CODE" in
            51|53|55|56|57|61|63|65|66|67|80|81|82|95|96|99) RAINING="true" ;;
          esac
          if (( $(echo "$PRECIP > 0" | bc -l 2>/dev/null || echo 0) )); then
            RAINING="true"
          fi

          case "$WEATHER_CODE" in
            0) CONDITION="Clear sky" ;;
            1|2|3) CONDITION="Partly cloudy" ;;
            45|48) CONDITION="Foggy" ;;
            51|53|55) CONDITION="Drizzle" ;;
            56|57) CONDITION="Freezing drizzle" ;;
            61|63|65) CONDITION="Rain" ;;
            66|67) CONDITION="Freezing rain" ;;
            71|73|75|77) CONDITION="Snow" ;;
            80|81|82) CONDITION="Rain showers" ;;
            85|86) CONDITION="Snow showers" ;;
            95|96|99) CONDITION="Thunderstorm" ;;
            *) CONDITION="Unknown" ;;
          esac

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build a 3-day forecast (tomorrow + 2 more days) from the daily
          # block. Only the derived condition/chance/likely_stream fields are
          # written out — never raw coordinates. Wrapped in try/catch so any
          # unexpected shape in the API response degrades to an empty
          # forecast instead of blocking the current-conditions write below.
          FORECAST=$(echo "$RESPONSE" | jq -c '
            def condition_for(code):
              if code == 0 then "Clear"
              elif ([1,2,3] | index(code)) then "Partly cloudy"
              elif ([45,48] | index(code)) then "Foggy"
              elif ([51,53,55] | index(code)) then "Drizzle"
              elif ([56,57] | index(code)) then "Freezing drizzle"
              elif ([61,63,65] | index(code)) then "Rain"
              elif ([66,67] | index(code)) then "Freezing rain"
              elif ([71,73,75,77] | index(code)) then "Snow"
              elif ([80,81,82] | index(code)) then "Rain showers"
              elif ([85,86] | index(code)) then "Snow showers"
              elif ([95,96,99] | index(code)) then "Thunderstorm"
              else "Unknown"
              end;
            def is_rain_code(code):
              ([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99] | index(code)) != null;
            try (
              (.daily // {}) as $d |
              [range(1;4) as $i |
                {
                  date: ($d.time[$i]? // null),
                  condition: condition_for($d.weather_code[$i]? // -1),
                  chance: ($d.precipitation_probability_max[$i]? // 0),
                  likely_stream: (($d.precipitation_probability_max[$i]? // 0) >= 50)
                }
              ]
            ) catch []
          ')

          jq -n \
            --argjson raining "$RAINING" \
            --arg condition "$CONDITION" \
            --arg last_checked "$NOW" \
            --argjson forecast "$FORECAST" \
            '{raining: $raining, condition: $condition, last_checked: $last_checked, forecast: $forecast}' \
            > status.json

          echo "status.json updated (weather details omitted from logs on purpose)"

      - name: Commit status.json if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update weather status"
          file_pattern: status.json
